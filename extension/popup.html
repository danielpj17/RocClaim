<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font: 13px/1.45 system-ui, -apple-system, Segoe UI, sans-serif;
      }
      h1 { font-size: 14px; margin: 0 0 10px; }
      label { display: block; margin: 10px 0 3px; font-weight: 600; font-size: 12px; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 7px;
        font: inherit;
        border: 1px solid #8884;
        border-radius: 5px;
        background: #8881;
        color: inherit;
      }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button {
        flex: 1;
        padding: 8px;
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 5px;
        cursor: pointer;
      }
      #start { background: #002E5D; color: #fff; }
      #stop { background: #8883; color: inherit; }
      #test { background: #8883; color: inherit; flex: 0 0 auto; padding: 8px 10px; font-weight: 400; }
      .status {
        margin-top: 12px;
        padding: 9px 10px;
        border-radius: 6px;
        background: #8881;
        font-size: 12px;
      }
      .on { color: #0a7d3c; font-weight: 700; }
      .off { color: #a33; font-weight: 700; }
      .muted { opacity: .65; }
      .hint { font-size: 11px; opacity: .65; margin-top: 3px; }
      #diag {
        margin-top: 10px;
        max-height: 150px;
        overflow: auto;
        font-size: 10px;
        font-family: ui-monospace, Consolas, monospace;
        white-space: pre-wrap;
        background: #f5a62318;
        border: 1px solid #f5a62355;
        border-radius: 5px;
        padding: 7px;
      }
      #log {
        margin-top: 10px;
        max-height: 110px;
        overflow-y: auto;
        font-size: 11px;
        font-family: ui-monospace, Consolas, monospace;
        opacity: .75;
        white-space: pre-wrap;
      }
      .warn {
        margin-top: 10px;
        font-size: 11px;
        padding: 8px;
        border-radius: 5px;
        background: #f5a62322;
        border: 1px solid #f5a62366;
      }
    </style>
  </head>
  <body>
    <h1>ROC Claim Watcher</h1>

    <label for="topic">ntfy topic</label>
    <input id="topic" placeholder="roc-..." />

    <label for="stop-at">Stop at</label>
    <input id="stop-at" type="datetime-local" />
    <div class="hint">Hard stop. Don't leave it running past when you'd actually go.</div>

    <div class="row">
      <button id="start">Watch this tab</button>
      <button id="stop">Stop</button>
      <button id="test" title="Send a test push">Test</button>
    </div>

    <div class="status" id="status">…</div>

    <div class="warn">
      Runs the seat search every 30&ndash;45s: sets quantity to 1 and clicks <b>Find Best Available</b>. It never clicks past the search &mdash; if a seat is found it stops and leaves the page for you. The seat is held ~10 min.
    </div>

    <pre id="diag" hidden></pre>
    <div id="log"></div>

    <script src="popup.js"></script>
  </body>
</html>
